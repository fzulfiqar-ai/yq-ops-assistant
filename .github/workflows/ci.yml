# Continuous integration (16-Sep-2026). Runs on every push to main and every pull request.
#
# Two jobs, both free on GitHub Actions:
#   api  — installs requirements.txt on the same Python the Dockerfile uses (3.11) and runs the
#          shop suite. The pricing engine, validation, routing, notification text and rate-limit
#          tests need no database; the live read-only checks print SKIP when no Supabase
#          credentials are present, so this job needs NO repository secrets.
#   web  — npm ci, eslint and BOTH production Vite builds of web/ (the portal, then the marketplace:
#          its own HTML, PWA and Tailwind config), then the Lighthouse bundle budgets on the market
#          build, so a type error, a broken import, a market build failure or a budget overrun
#          never reaches Cloudflare. VITE_* values are placeholders: the builds only need them to
#          exist.
#
# This does not deploy (cf-deploy.yml, which waits for this workflow on the same commit, and the
# Render API trigger do). A red run here is the signal not to ship.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A pull request's newer push cancels its older run; a push to main never does: cf-deploy waits for
# ci.yml on its own commit (decision D11), and a newer non-web push cancelling that run would leave the
# web commit never deployed (review C2). Main runs are few; each one finishes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install
        run: pip install -r requirements.lock   # the exact production versions
      - name: Shop suite (pricing, routing, rate limits; live checks SKIP without secrets)
        run: python -m tests.test_shop
      # R1 sold-out rule: price_cart both paths, the stale-snapshot reason, the copy, the harness
      # order and the migration (its node half prints SKIP here — the web job runs it for real)
      - name: Sold-out rule (release R1; no DB)
        run: python -m tests.test_r1_soldout
      - name: R1 suites - alerts, security gates, data honesty, order safety, Coming Soon (no DB)
        env:
          SUPABASE_URL: https://ci.invalid   # only builds the JWKS client URL; nothing is fetched
        run: |
          python -m tests.test_r1_alerts
          python -m tests.test_r1_security
          python -m tests.test_r1_data
          python -m tests.test_r1_orders
          python -m tests.test_r1b_upcoming
      # R2 loader / costs / margin truth / receivables: pure tests here; the "local:" replay
      # tests print SKIP without the scratch Postgres
      - name: R2 loader suite (no DB)
        env:
          SUPABASE_URL: https://ci.invalid
        run: python -m tests.test_r2_loader
      # R6 speed + reliability: the ETag/304 hot path on a synthetic context, uploads off the loop,
      # the migration pair, RUM/error meta, the edge Worker config (its node half SKIPs here — the
      # web job runs it for real)
      - name: R6 suite - speed and reliability (no DB)
        env:
          SUPABASE_URL: https://ci.invalid
        run: python -m tests.test_r6_speed
      # R8 data stamp: a load made outside the API (a developer's PC, a cron) is noticed by the API
      # itself, which then drops its cached numbers (app/datastamp.py). A stand-in stamp reader, and
      # the real reader on httpx.MockTransport
      - name: R8 suite - the API notices a data load (no DB)
        env:
          SUPABASE_URL: https://ci.invalid
        run: python -m tests.test_r8_datastamp
      # R3a: follow-ups, statements (one approval per month, figure-based dedup, the CLI's
      # --commit path on a fake connection), attainment, gates. The two scratch-Postgres
      # replays print SKIP here (no cluster, no psycopg); they run on the dev machine.
      - name: R3 suite - reps (no DB)
        env:
          SUPABASE_URL: https://ci.invalid
        run: python -m tests.test_r3_reps
      # R3b pipeline states, customer attribution, admin audit (the local-Postgres replay SKIPs here)
      - name: R3 pipeline suite (no DB)
        env:
          SUPABASE_URL: https://ci.invalid
        run: python -m tests.test_r3_pipeline
      # R7a "Make it true": reliability (analytics crash, JSON 500 inside CORS, retry once,
      # inventory grants), reminder hygiene + notifications log, Focus link v1, the read-only
      # management role, and the order desk (source checks). All in-memory; replays SKIP here.
      - name: R7a suites (no DB)
        env:
          SUPABASE_URL: https://ci.invalid
        run: |
          python -m tests.test_r7a_reliability
          python -m tests.test_perf_transport
          python -m tests.test_r7a_reminders
          python -m tests.test_r7a_focus
          python -m tests.test_r7a_rbac
          python -m tests.test_r7a_b4
          python -m tests.test_r7b_security
          python -m tests.test_r7b_command
          python -m tests.test_r7b_rep
          python -m tests.test_r7b_ai_head
          python -m tests.test_r7b_market_intel
          python -m tests.test_r8m_market_quality_replay   # Market Intel v2 migration pins; its replay SKIPs (no Postgres)
          python -m tests.test_r8m_market_intel_import
          python -m tests.test_r8m_supplier_reports
          python -m tests.test_r8n_ai_market_signals   # R8: the weekly AI Head reads Market Intel (replay SKIPs here)
          python -m tests.test_r8m_market_quality
          python -m tests.test_r8m_mi_e2e   # Market Intel v2: the four modules end to end on one stand-in held to the real schema
          python -m tests.test_r8m_release_script   # the Market Intel v2 release script + runbook, read as text (never run)
          python -m tests.test_r7b_arabic
          python -m py_compile scripts/weekly_report.py   # owner tool: must parse on the pinned 3.11
      # R7c order heart (Sprint 3): Received -> Confirmed -> Delivered, the one editor, the price lock,
      # the adverse tick, deliver with changes, reopen, the Decimal property test; the local-Postgres
      # replay of the migration SKIPs here
      - name: R7c order heart suite (no DB)
        env:
          SUPABASE_URL: https://ci.invalid
        run: python -m tests.test_r7c_order_heart
      # R7e price book 41: open orders get the cuts on their confirmed layer (on the order heart's
      # fakes: CAS, undo, reverse, re-run no-op), and the price in force replaces MAX(rate_bhd)
      - name: R7e price book suite (no DB)
        env:
          SUPABASE_URL: https://ci.invalid
        run: python -m tests.test_r7e_pricebook
      # R8 daily sales chart (Command Centre, the sales.daily tile): one zero-filled point per calendar day
      # for the 30 days to the data date, Fri + Sat the weekend, the business-day average, the best day; a
      # failed read costs that tile only. On test_r7b_command's fake RPC; its node half is numbers_ui_test.mjs
      - name: R8 daily sales chart suite (no DB)
        env:
          SUPABASE_URL: https://ci.invalid
        run: python -m tests.test_r8_daily
      # R2a batch importer: the pure tests; the local-Postgres replay SKIPs here. Its own step — it
      # used to sit on a folded second line of the step above, which YAML read as extra arguments to
      # test_r3_pipeline, so it never ran.
      - name: R2 importer suite (no DB)
        env:
          SUPABASE_URL: https://ci.invalid
        run: python -m tests.test_r2_importer
      - name: Template eval (deterministic answers, no DB)
        run: python tests/run_eval.py
      # R2c exact money: price_cart / confirm / tier_progress on Decimal end to end — 10,000 random
      # carts against a pure-Decimal reference, to the fils (no DB). Sits after the eval step; the
      # R3 suites go above it, after test_r1b_upcoming.
      - name: Exact money (release R2; no DB)
        env:
          SUPABASE_URL: https://ci.invalid
        run: python -m tests.test_r2_money
      # R7c order heart, the page (Sprint 3, S3b): the order desk and the rep's field sheet on the
      # three stages — one forward button, the one editor, the adverse tick, Tell the shop (source
      # checks; the node half SKIPs here — the web job runs it for real)
      - name: R7c order desk + field sheet (no DB)
        env:
          SUPABASE_URL: https://ci.invalid
        run: python -m tests.test_r7c_ui
      # R7d (Wave C): merchant ordering (What changed, honest placed screen, same as last time,
      # area reps, product requests), shop analytics on SQL views + the merchant profile, one
      # official margin + master data, the offer ledger + follow-up hold-outs + rate limits per real
      # client. All in-memory; the local-Postgres replays SKIP here.
      - name: R7d suites (no DB)
        env:
          SUPABASE_URL: https://ci.invalid
        run: |
          python -m tests.test_r7d_merchant
          python -m tests.test_r7d_analytics
          python -m tests.test_r7d_profit
          python -m tests.test_r7d_ops
          python -m tests.test_r7d_least_privilege
      # R8: the Dashboard shows Mobile Accessories only — the Cash / Credit chips' SQL and assembly, the
      # division filter on low stock (the email digests unchanged), momentum, DSO and dead stock, and the
      # payload's keys (added only). All in-memory; its node half is numbers_ui_test.mjs in the web job.
      - name: R8 Dashboard suite - Mobile Accessories only (no DB)
        env:
          SUPABASE_URL: https://ci.invalid
        run: python -m tests.test_r8_dashboard
      # YQ Ops Skills, phase 1 (/yq-load, /yq-brief): the read-only engine `python -m scripts.ops` and
      # its one writer, scripts/yq_load_go.py. Every suite pins the Supabase and database addresses to
      # ci.invalid before any import: a write through any channel must raise, the load check reads
      # synthetic Focus files and the writer runs on a stand-in step runner (the daily backup's starter,
      # scripts/yq_nightly.py, runs on a stand-in for the backup job: the job never runs here). These
      # tools run on the owner's PC (3.14), never in the API image, so the first line proves they still
      # parse on 3.11.
      # Comparisons with real Focus files print SKIP here (business_data/ is not in the repository).
      # A failed test is also raised as an annotation (its title, the assert line and the error line),
      # so the run's summary page names it without the log being opened.
      # `shell: bash` is what makes a failed suite fail this step: GitHub runs an explicitly named bash
      # with -eo pipefail, its default shell without pipefail, and without it the status of
      # `suite | tee` is tee's, so the || branch never ran and a red suite passed the step.
      # The monthly workbook (/yq-month) is written with XlsxWriter, a development-only library pinned in
      # requirements-dev.txt and never in the API image: installed here for the report suite alone.
      - name: XlsxWriter for the report suite (development only, not in the API image)
        run: pip install XlsxWriter==3.2.9
      - name: Ops skills suites - read-only engine, load check, load writer, gate snapshot, reconcile, brief, delivery, sender, backups, report, stock, photos (no DB)
        shell: bash
        env:
          SUPABASE_URL: https://ci.invalid
        run: |
          set -o pipefail
          python -m compileall -q scripts/ops scripts/yq_load_go.py scripts/yq_send.py scripts/yq_secrets.py scripts/yq_backup.py scripts/yq_photos.py scripts/yq_nightly.py
          for suite in readonly engine skills sales moves load load_go load_txn gate reconcile deliver send backup report stock photos nightly verify; do
            echo "== tests.test_ops_$suite"
            python -m tests.test_ops_$suite 2>&1 | tee "$RUNNER_TEMP/ops_suite.log" || {
              grep -E '^(FAIL|[[:space:]]+assert |[A-Za-z_.]*(Error|Exception)\b)' "$RUNNER_TEMP/ops_suite.log" \
                | head -n 30 | sed "s/^/::error title=tests.test_ops_$suite::/"
              exit 1
            }
          done

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      # R1 sold-out rule on the real listing helpers (facets / search / quickParse), transpiled
      # with the project's own typescript — Enter never substitutes a sold-out code, sold out last
      - name: Sold-out ordering (node, no browser)
        run: node scripts/soldout_order_test.mjs
      - name: Arabic strings — every English key has an Arabic twin (R7b)
        run: node scripts/arabic_test.mjs
      # R6 edge catalog Worker (web/workers/market.js) on fakes: cache states, the 3 s soft timeout,
      # non-200 never stored, missing chunks → 404
      - name: Edge Worker behaviour (node, no network)
        run: node scripts/market_worker_test.mjs
      # R7c order heart (web/src/pages/shop-ops/heart.ts) on hand-worked orders: which change needs a
      # reason, when the "Shop agreed" tick is required, the pro-rata cart share to the fils
      - name: Order heart rules (node, no browser)
        run: node scripts/order_heart_ui_test.mjs
      # R7d merchant ordering helpers (market/lib/orderChanges.ts and friends) on hand-worked orders
      - name: Merchant ordering rules (node, no browser)
        run: node scripts/merchant_test.mjs
      # the rep's screens (R7b/R7c review): quick-add only for an explicit list, one checkout id per
      # order (never a shop-A duplicate for shop B), the Change carry, "shop told" on a rep-placed order
      - name: Rep screen rules (node, no browser)
        run: node scripts/rep_ui_test.mjs
      # least privilege (R7d review): management's drill links need the page's own grant
      - name: Least-privilege routing (node, no browser)
        run: node scripts/least_privilege_test.mjs
      # portal number wording (rc review): dead stock's uncosted items named beside the at-cost value,
      # marketplace money labelled incl. VAT (lib/basisText.ts); R8: the Dashboard page is Mobile
      # Accessories only (its every-division chips can never come back), and the Command Centre's daily
      # sales chart — its x labels, target line, three facts and the card's Daily / Weekly heading
      # (lib/dailySales.ts)
      - name: Portal number wording (node, no browser)
        run: node scripts/numbers_ui_test.mjs
      # A hard gate since R7b: the portal lints at 0 errors (the pre-existing React-compiler and `any`
      # findings were fixed or annotated in the Wave A integration). An error fails the job; a warning
      # does not. Type errors fail it too: tsc -b runs inside `npm run build`.
      - name: Lint
        run: npm run lint
      - name: Build
        env:
          VITE_API_URL: https://api.invalid
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder
        run: npm run build
      # the marketplace exactly as cf-deploy builds it (VITE_APP=market -> web/dist-market); until
      # now it was first built at deploy time, after the merge
      - name: Build the marketplace
        env:
          VITE_APP: market
          VITE_API_URL: https://api.invalid
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder
        run: npm run build:market
      # the Lighthouse budgets (.github/lighthouserc.json, read by the script) as a hard gate on the
      # market build: the home routes' up-front scripts, the stylesheet and the market's own fonts
      - name: Bundle budgets (lighthouserc)
        run: python3 ../scripts/qa/bundle_sizes.py dist-market --gate
