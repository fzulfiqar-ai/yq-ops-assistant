# Deploy the two web builds to Cloudflare (Workers static assets) on every push to main (20-Sep-2026).
# Cloudflare replaced Vercel as the static host: Vercel Hobby caps Fast Data Transfer at 100 GB/month,
# pauses every project in the team past it and forbids commercial use; static-asset requests on
# Workers are free and unlimited. Vercel now only redirects the old hostnames (web/vercel.json).
#
# Mirrors scripts/deploy_cf.py (the manual path): each bundle is built here with its env baked in -
# the market gets the API origin, the portal also the public Supabase URL + anon key (the same values
# the keepalive workflow already holds as secrets) - then `wrangler deploy` uploads it with the app's
# config (web/wrangler.market.jsonc / web/wrangler.portal.jsonc: assets only, SPA fallback,
# public/_headers). BUILD_ID = the commit, stamped into /version.json and the service worker.
#
# SETUP: two repository secrets - Settings -> Secrets and variables -> Actions:
#   CLOUDFLARE_API_TOKEN   an account token with Workers Scripts/Routes + DNS write
#                          (the .env CLOUDFLARE_API_TOKEN_WRITE value)
#   CLOUDFLARE_ACCOUNT_ID  the Cloudflare account id (the .env CLOUDFLARE_ACCOUNT_ID value)
# Both were added on 21-Sep-2026; before that the job SKIPPED on every push (a "success" that deployed
# nothing) and web deploys were manual via scripts/deploy_cf.py.
# Until both exist the job SKIPS with a notice - it never fails, so it can never become a source of
# failure e-mails the way shop-cron was while its secret was missing.
#
# CI FIRST (lead decision D11, 25-Sep-2026): a push used to deploy whether or not ci.yml passed on
# it. Now the `ci-passed` job waits for ci.yml's run on the SAME commit and the deploy needs it: a
# red or missing CI run deploys nothing. It stays a push trigger with the web/** paths filter (a
# workflow_run trigger has no paths filter, and a deploy on every green push would stamp a new
# /version.json and prompt every merchant to update for nothing). A CI run that is re-run to green
# does not start a deploy by itself: run this workflow by hand (workflow_dispatch) on that commit.
# Kept to this one file, so the commit that added it (ci(deploy): ...) can be dropped on its own.
name: cf-deploy

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/cf-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cf-deploy
  cancel-in-progress: true

jobs:
  # ci.yml runs on the same push; wait for its run on this exact commit and pass only if it passed
  ci-passed:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
    steps:
      - name: Wait for ci.yml on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          for i in $(seq 1 120); do
            state=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&per_page=1" --jq '.workflow_runs[0] | if . == null then "none" else "\(.status)/\(.conclusion)" end')
            case "$state" in
              completed/success) echo "ci passed on $SHA"; exit 0 ;;
              completed/cancelled) echo "::error::ci on $SHA was cancelled (a newer push?) - nothing is deployed; once ci is green on main, run cf-deploy by hand"; exit 1 ;;
              completed/*) echo "::error::ci did not pass on $SHA ($state) - nothing is deployed"; exit 1 ;;
              none) if [ "$i" -gt 20 ]; then echo "::error::no ci run for $SHA - nothing is deployed"; exit 1; fi ;;
            esac
            sleep 20
          done
          echo "::error::ci still running on $SHA after 40 minutes - nothing is deployed"
          exit 1

  deploy:
    needs: ci-passed
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VITE_API_URL: https://yq-ops-assistant.onrender.com
      BUILD_ID: ${{ github.sha }}
      CI: "true"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Check the Cloudflare secrets
        id: gate
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID repository secrets are not set - skipping the Cloudflare deploy (deploy by hand: python -m scripts.deploy_cf market|portal)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        if: steps.gate.outputs.ready == 'true'
        working-directory: web
        run: npm ci

      - name: Build the marketplace (VITE_APP=market -> web/dist-market)
        if: steps.gate.outputs.ready == 'true'
        working-directory: web
        env:
          VITE_APP: market
        run: npm run build:market
      - name: Build the portal (-> web/dist)
        if: steps.gate.outputs.ready == 'true'
        working-directory: web
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Deploy the marketplace (Worker yq-marketplace)
        if: steps.gate.outputs.ready == 'true'
        working-directory: web
        run: npx --yes wrangler@4 deploy -c wrangler.market.jsonc
      - name: Deploy the portal (Worker yq-bahrain-ops)
        if: steps.gate.outputs.ready == 'true'
        working-directory: web
        run: npx --yes wrangler@4 deploy -c wrangler.portal.jsonc
