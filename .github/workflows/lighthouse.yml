# Weekly Lighthouse against the live marketplace (plan §X). Informational: it never blocks a push.
# The API sleeps on the free tier, so a cold run can look slow; compare trends, not single runs.
# Run by hand from the Actions tab (workflow_dispatch) after a performance change.
name: lighthouse

on:
  schedule:
    - cron: '30 4 * * 1'   # Mondays 07:30 Bahrain
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wake the API first (free tier sleeps)
        run: curl -sS --max-time 120 -o /dev/null -w 'API %{http_code} in %{time_total}s\n' https://yq-ops-assistant.onrender.com/public/market || true
      - name: Lighthouse (mobile, 3 runs, median)
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://yq-marketplace.vercel.app/
            https://yq-marketplace.vercel.app/furqan
            https://yq-marketplace.vercel.app/cart
          runs: 3
          uploadArtifacts: true
          temporaryPublicStorage: false
          configPath: .github/lighthouserc.json
