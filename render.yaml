# Render blueprint — free-tier host for the YQ Bahrain ops API.
#
# Replaces Railway, whose trial lapsed and whose deployments were REMOVED.
# Free tier reality check:
#   * 512 MB RAM / 0.1 CPU  -> requirements.txt is kept lean for this
#   * sleeps after 15 min idle (~50 s cold start); the keepwarm Worker pings /health every
#     10 min so it never does. 750 free instance-hours a month cover ONE always-on service
#     only: keep every other free service suspended (Frankfurt yq-ops-assistant: 29-Sep-2026)
#   * no credit card required
#
# Deploy:  Render Dashboard -> New -> Blueprint -> pick this repo.
# Secrets are marked `sync: false`, so Render never reads them from git; set
# them in the dashboard (bulk-paste .env.render via "Add from .env").
services:
  - type: web
    name: yq-ops-api-sg
    runtime: docker
    plan: free
    # Singapore, next to the Supabase database (aws-1-ap-southeast-1). Every page runs
    # 2-20 PostgREST calls, each one paid Frankfurt<->Singapore when the API sat in
    # Frankfurt; Bahrain reaches both regions in ~0.15 s, so the browser loses nothing.
    # Measured 28-Sep-2026: /digest/daily 1.7-2.4 s (Frankfurt) -> 0.44-0.61 s (Singapore).
    # Served as https://api.yqmarketplace.com (Cloudflare DNS-only CNAME; Render is
    # already behind Cloudflare). Frankfurt yq-ops-assistant is kept SUSPENDED as rollback.
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    # R7b (plan §25 P1): never deploy on push. Every API deploy is a deliberate, gated step —
    # `python -m scripts.render_deploy deploy --commit <sha> --wait` (docs/RELEASE.md) — so a push to
    # main (or the Render GitHub app, once installed) can never ship an un-gated build. The live
    # service's own "Auto-Deploy" setting must say No as well (Render dashboard -> Settings).
    autoDeploy: false
    envVars:
      # --- Supabase ---
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false

      # --- portal wiring (public URLs, but kept out of git for consistency) ---
      - key: ALLOWED_ORIGINS
        sync: false
      - key: APP_BASE_URL
        sync: false
      # Render puts exactly one proxy in front of the container; the rate limiter and the
      # hashed client IP on orders read the client from X-Forwarded-For with this hop count
      # (app/ratelimit.py). Not a secret. Default is already 1 when RENDER=true is present.
      # Behind that trusted hop, CF-Connecting-IP (Cloudflare fronts Render and overwrites it) wins
      # over the right-most entry, which is a Cloudflare edge; TRUST_CF_CONNECTING_IP=0 turns that off.
      - key: TRUSTED_PROXY_HOPS
        value: "1"

      # --- internal auth ---
      - key: AGENT_API_KEY
        sync: false
      - key: AGNES_API_KEY
        sync: false
      - key: DASHBOARD_SECRET
        sync: false

      # --- LLM providers ---
      - key: GROQ_API_KEY
        sync: false
      - key: CEREBRAS_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: TOGETHER_API_KEY
        sync: false
      - key: SCALEWAY_API_KEY
        sync: false

      # --- email ---
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: ALERT_EMAIL_TO
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false

      # --- outreach / research tooling ---
      - key: TAVILY_API_KEY
        sync: false
      - key: APIFY_TOKEN
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: WA_HUMAN_NUMBER
        sync: false
