    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>YQ Bahrain · AI Portal</title>
    <!-- Starts the catalog request for /c/{token} before the app downloads (see the file). -->
    <script src="/catalog-prefetch.js" data-api="%VITE_API_URL%"></script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
