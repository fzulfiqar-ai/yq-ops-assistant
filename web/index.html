<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/yq-icon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#6d28d9" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="YQ Bahrain AI Portal — run your whole business from one place." />
    <meta property="og:title" content="YQ Bahrain · AI Portal" />
    <meta property="og:description" content="A full team of AI agents working for you." />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="%VITE_API_URL%" crossorigin />
    <!-- portal-fonts: Instrument Sans (text) + Sora (display) self-hosted from public/fonts (OFL), the
         marketplace's faces (ship 2, 30-Oct-2026: one identity); @font-face in src/index.css. Only the text
         face is preloaded. The Google Fonts stylesheet this once replaced was render-blocking (R6, 24-Sep-2026).
         The market build swaps this whole block for its own fonts: vite.config.ts marketHtml(). -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/instrument-sans-v1.woff2" />
    <!-- /portal-fonts -->
    <title>YQ Bahrain · AI Portal</title>
    <!-- Starts the catalog request for /c/{token} before the app downloads (see the file). -->
    <script src="/catalog-prefetch.js" data-api="%VITE_API_URL%"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
