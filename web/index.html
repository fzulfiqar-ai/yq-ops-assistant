<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/yq-icon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#6d28d9" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="YQ Bahrain AI Portal — run your whole business from one place." />
    <meta property="og:title" content="YQ Bahrain · AI Portal" />
    <meta property="og:description" content="A full team of AI agents working for you." />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="%VITE_API_URL%" crossorigin />
    <!-- portal-fonts: Inter + Space Grotesk self-hosted from public/fonts (OFL, the fontsource latin
         variable builds; @font-face in src/index.css). The Google Fonts stylesheet this replaces was
         render-blocking and its two hosts were the last third parties in the CSP (R6, 24-Sep-2026).
         The market build swaps this whole block for its own fonts: vite.config.ts marketHtml(). -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/inter-v1.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/space-grotesk-v1.woff2" />
    <!-- /portal-fonts -->
    <title>YQ Bahrain · AI Portal</title>
    <!-- Starts the catalog request for /c/{token} before the app downloads (see the file). -->
    <script src="/catalog-prefetch.js" data-api="%VITE_API_URL%"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
